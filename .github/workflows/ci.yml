name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --extra mcp, never --all-extras: the mcp server is small and pure Python and its
      # tests skip themselves when it is absent, which means nobody was running them. The
      # laya extra stays out -- it pulls torch and downloads 808 MB of weights, and the one
      # test that exercises the real model is opt-in behind TOKUNSEBA_LAYA_SMOKE.
      - name: Install dependencies
        run: uv sync --group dev --extra mcp
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest -q
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Lint
        run: uv run --with ruff ruff check src tests --select F,E9
        env:
          UV_PYTHON: ${{ matrix.python-version }}

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build wheel and sdist
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
