[project]
name = "tokunseba"
version = "0.1.0"
description = "A local proxy for every AI coding tool on your machine: it shrinks each request without losing a byte, and routes each turn to the model that turn actually needs"
readme = "README.md"
authors = [{ name = "tokunseba contributors" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "llm",
  "tokens",
  "proxy",
  "claude",
  "anthropic",
  "openai",
  "prompt-cache",
  "cache",
  "cli",
  "agent",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Software Development",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
]
requires-python = ">=3.12,<3.14"
dependencies = [
  "starlette>=0.40",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "click>=8.1",
  "tiktoken>=0.8",
  "tokenizers>=0.20",
  "tomli-w>=1.0",
  "rich>=13.0",
]

[project.optional-dependencies]
laya = ["laya>=0.3.5"]
mcp = ["mcp>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
tokunseba = "tokunseba.cli:main"

[project.urls]
Homepage = "https://github.com/keshavgarg24/tokunseba"
Repository = "https://github.com/keshavgarg24/tokunseba"
Issues = "https://github.com/keshavgarg24/tokunseba/issues"
Changelog = "https://github.com/keshavgarg24/tokunseba/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokunseba"]

[tool.hatch.build.targets.sdist]
include = [
  "src/tokunseba",
  "tests",
  "assets",
  "README.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
